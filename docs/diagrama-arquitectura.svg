<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#000">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="42" font-size="22" font-weight="bold" text-anchor="middle">Arquitectura - Concert Tracker</text>

  <!-- ================= CLIENTES ================= -->
  <rect x="40" y="80" width="300" height="480" fill="none" stroke="#666" stroke-dasharray="8 5"/>
  <text x="55" y="104" font-weight="bold" fill="#444">Clientes</text>

  <!-- Web -->
  <rect x="80" y="130" width="220" height="110" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="190" y="170" font-weight="bold" text-anchor="middle" font-size="17">Web</text>
  <text x="190" y="195" text-anchor="middle">React + Vite</text>
  <text x="190" y="218" text-anchor="middle" fill="#444">(Vercel)</text>

  <!-- App móvil -->
  <rect x="80" y="330" width="220" height="130" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="190" y="370" font-weight="bold" text-anchor="middle" font-size="17">App móvil</text>
  <text x="190" y="395" text-anchor="middle">React Native + Expo</text>
  <text x="190" y="418" text-anchor="middle" fill="#444">(Expo Go / EAS Update)</text>
  <text x="190" y="441" text-anchor="middle" fill="#444" font-size="13">GPS · cámara QR</text>

  <!-- ================= BACKEND ================= -->
  <rect x="440" y="80" width="460" height="660" fill="none" stroke="#666" stroke-dasharray="8 5"/>
  <text x="455" y="104" font-weight="bold" fill="#444">Backend (Render)</text>

  <rect x="480" y="125" width="380" height="390" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
  <text x="670" y="152" font-weight="bold" text-anchor="middle" font-size="17">API REST - Spring Boot</text>

  <rect x="510" y="175" width="320" height="60" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="670" y="201" text-anchor="middle" font-weight="bold">Spring Security</text>
  <text x="670" y="222" text-anchor="middle" font-size="13">filtro JWT, CORS, roles</text>

  <rect x="510" y="265" width="320" height="50" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <text x="670" y="295" text-anchor="middle">Controllers</text>

  <rect x="510" y="345" width="320" height="50" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <text x="670" y="375" text-anchor="middle">Services</text>

  <rect x="510" y="425" width="320" height="50" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <text x="670" y="455" text-anchor="middle">Repositories (JPA)</text>

  <line x1="670" y1="235" x2="670" y2="265" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="670" y1="315" x2="670" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="670" y1="395" x2="670" y2="425" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- tareas async -->
  <rect x="480" y="560" width="180" height="140" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="570" y="600" text-anchor="middle" font-weight="bold">Eventos</text>
  <text x="570" y="624" text-anchor="middle" font-size="13">(@Async)</text>
  <text x="570" y="652" text-anchor="middle" font-size="13">envío de correos al</text>
  <text x="570" y="670" text-anchor="middle" font-size="13">crear asistencia,</text>
  <text x="570" y="688" text-anchor="middle" font-size="13">reseña o concierto</text>

  <rect x="680" y="560" width="180" height="140" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="770" y="600" text-anchor="middle" font-weight="bold">Sync Ticketmaster</text>
  <text x="770" y="624" text-anchor="middle" font-size="13">(@Scheduled)</text>
  <text x="770" y="652" text-anchor="middle" font-size="13">al iniciar y</text>
  <text x="770" y="670" text-anchor="middle" font-size="13">todos los días</text>
  <text x="770" y="688" text-anchor="middle" font-size="13">a las 3 a. m.</text>

  <line x1="570" y1="515" x2="570" y2="560" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="770" y1="515" x2="770" y2="560" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- ================= EXTERNOS ================= -->
  <rect x="1000" y="80" width="360" height="660" fill="none" stroke="#666" stroke-dasharray="8 5"/>
  <text x="1015" y="104" font-weight="bold" fill="#444">Base de datos y servicios externos</text>

  <!-- PostgreSQL cilindro -->
  <path d="M1090,300 v90 a90,22 0 0 0 180,0 v-90" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <ellipse cx="1180" cy="300" rx="90" ry="22" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="1180" y="355" text-anchor="middle" font-weight="bold" font-size="17">PostgreSQL</text>
  <text x="1180" y="380" text-anchor="middle" fill="#444">(Neon)</text>

  <!-- Ticketmaster -->
  <rect x="1080" y="590" width="200" height="80" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="1180" y="625" text-anchor="middle" font-weight="bold">Ticketmaster</text>
  <text x="1180" y="648" text-anchor="middle" font-size="13">Discovery API</text>

  <!-- Mailtrap -->
  <rect x="1080" y="130" width="200" height="80" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="1180" y="165" text-anchor="middle" font-weight="bold">Mailtrap</text>
  <text x="1180" y="188" text-anchor="middle" font-size="13">servidor SMTP</text>

  <!-- Open-Meteo (abajo a la izquierda) -->
  <rect x="80" y="630" width="220" height="80" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="190" y="665" text-anchor="middle" font-weight="bold">Open-Meteo</text>
  <text x="190" y="688" text-anchor="middle" font-size="13">API del clima</text>

  <!-- ================= FLECHAS ================= -->
  <!-- Web -> Security -->
  <polyline points="300,185 400,185 400,205 510,205" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- App -> Security -->
  <polyline points="300,395 420,395 420,222 510,222" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="346" y="276" width="148" height="44" fill="#fff"/>
  <text x="420" y="294" text-anchor="middle" font-size="13">HTTP / JSON</text>
  <text x="420" y="312" text-anchor="middle" font-size="13">+ token JWT</text>

  <!-- App -> Open-Meteo -->
  <line x1="190" y1="460" x2="190" y2="630" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="198" y="570" width="60" height="20" fill="#fff"/>
  <text x="203" y="585" font-size="13">clima</text>

  <!-- Repositories -> DB -->
  <polyline points="830,450 960,450 960,345 1090,345" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="925" y="388" width="70" height="20" fill="#fff"/>
  <text x="960" y="403" text-anchor="middle" font-size="13">JDBC</text>

  <!-- Eventos -> Mailtrap -->
  <polyline points="480,630 460,630 460,760 940,760 940,170 1080,170" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="975" y="150" width="50" height="20" fill="#fff"/>
  <text x="1000" y="164" text-anchor="middle" font-size="13">SMTP</text>

  <!-- Sync -> Ticketmaster -->
  <line x1="860" y1="630" x2="1080" y2="630" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="975" y="610" width="60" height="20" fill="#fff"/>
  <text x="1005" y="624" text-anchor="middle" font-size="13">HTTP</text>
</svg>
