spring.application.name=backend
jwt.secret=${JWT_SECRET:cambia-esto-por-una-clave-aleatoria-de-al-menos-32-caracteres}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/concert_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8080}
spring.data.web.pageable.max-page-size=100

# Servicio de correo (SMTP)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:no-reply@concerttracker.com}
