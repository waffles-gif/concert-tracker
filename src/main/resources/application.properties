spring.application.name=backend
jwt.secret=${JWT_SECRET:cambia-esto-por-una-clave-aleatoria-de-al-menos-32-caracteres}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/concert_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
server.port=${PORT:8080}
spring.data.web.pageable.max-page-size=100

# CORS: orígenes de la web separados por coma. En producción va el dominio real de la web,
# por ejemplo CORS_ALLOWED_ORIGINS=https://concert-tracker.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Datos de demostración (desactivados por defecto). Activar con DEMO_DATA_ENABLED=true
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
app.demo-data.user-password=${DEMO_USER_PASSWORD:Demo12345}

# Servicio de correo (SMTP)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:no-reply@concerttracker.com}

# Ticketmaster Discovery API (la clave va en application-local.properties o en la variable TICKETMASTER_API_KEY)
ticketmaster.api-key=${TICKETMASTER_API_KEY:}
ticketmaster.country-code=${TICKETMASTER_COUNTRY_CODE:PE}
# Los recintos de Perú casi nunca traen ciudad en Ticketmaster; se usa esta
ticketmaster.default-city=${TICKETMASTER_DEFAULT_CITY:Lima}
# Sincronización automática diaria (apagada por defecto; la manual es POST /api/v1/admin/sync/ticketmaster)
ticketmaster.sync.enabled=${TICKETMASTER_SYNC_ENABLED:false}